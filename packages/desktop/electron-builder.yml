appId: com.pinklogic.app
productName: Pink Logic
copyright: Copyright © Pink Logic
directories:
  output: release
files:
  - dist/**/*
  - dist-web/**/*
  - package.json
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Pink-Logic-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pink Logic
  uninstallDisplayName: Pink Logic
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  installerLanguages: [pt_BR, pt_PT, en_US, es_ES]
  displayLanguageSelector: true
# Updates require a signed release and an explicitly configured trusted feed.
# Publication remains disabled by --publish=never in the build script.
